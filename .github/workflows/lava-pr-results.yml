name: LAVA PR results

on:
  workflow_call:
    inputs:
      validation_run:
        required: true
        type: string
      validation_attempt:
        required: true
        type: string
      validation_result:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      validation_run:
        description: Completed LAVA PR validation workflow run ID to recover
        required: true
        type: string
      validation_attempt:
        description: Attempt to recover, empty selects the latest completed attempt
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: lava-results-${{ inputs.validation_run }}
  cancel-in-progress: false

jobs:
  results:
    if: >-
      always() &&
      github.repository == 'qualcomm-linux/qcom-linux-testkit' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    environment: lava-oss
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: kernel-prd-u2404-x64-large-od-ephem
    timeout-minutes: 30
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - run: python -m pip install -r ci/lava-pr-requirements.txt

      - name: Resolve trusted validation request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run }}
          VALIDATION_RUN_ATTEMPT: ${{ inputs.validation_attempt }}
          VALIDATION_RESULT: ${{ inputs.validation_result }}
        run: python scripts/lava_pr_validation.py resolve

      - name: Download prepared request
        if: steps.request.outputs.prepared == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.request.outputs.run_id }}
          name: ${{ steps.request.outputs.artifact_name }}
          path: lava-output

      - name: Reconcile jobs and publish results
        if: steps.request.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}
          LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
          VALIDATION_RUN_ID: ${{ steps.request.outputs.run_id }}
        run: python scripts/lava_pr_validation.py finish

      - name: Save results and evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lava-results-${{ inputs.validation_run }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lava-output/results.json
            lava-output/summary.md
          if-no-files-found: ignore
          retention-days: 30
