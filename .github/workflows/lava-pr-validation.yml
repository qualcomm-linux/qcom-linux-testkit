name: LAVA PR validation
run-name: 'LAVA PR validation - PR #${{ inputs.pr }}'

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Testkit PR number
        required: true
        type: string
      targets:
        description: meta-qcom selects all enabled machines except qcm6490-idp, or enter comma-separated machine names or configured Foundries device types
        required: true
        default: meta-qcom
        type: string
      include_meta_qcom:
        description: Include meta-qcom pre-merge tests alongside selected PR tests.
        default: true
        type: boolean
      test_names:
        description: Comma-separated suite or YAML names, e.g. Ethernet_Inventory_Validation,AudioPlayback_Config01. Empty selects changed suites.
        type: string
      revision:
        description: Full PR commit SHA, empty resolves current PR head. Reruns retain the original SHA.
        type: string
      distro:
        description: Meta-qcom build
        default: meta-qcom-main
        type: choice
        options:
          - meta-qcom-main
          - meta-qcom-lts-6.18
      image_type:
        description: Multimedia image configuration
        default: base
        type: choice
        options:
          - base
          - overlay
          - both
      nightly_run:
        description: Optional successful meta-qcom nightly or extended build run ID. Reruns reuse the original images.
        type: string
      selections:
        description: Advanced JSON suite selections for params, tags or fresh_boot. Do not repeat suites from test_names.
        default: '{}'
        type: string
      submit:
        description: Submit hardware jobs after preparation and validation
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Different PRs may validate together. Keep submissions for one PR serialized.
concurrency:
  group: testkit-lava-foundries-pr-${{ inputs.pr }}
  cancel-in-progress: false
  queue: max

jobs:
  request:
    if: github.repository == 'qualcomm-linux/qcom-linux-testkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      sha: ${{ steps.context.outputs.sha }}
      context_attempt: ${{ steps.context.outputs.context_attempt }}
      include_meta_qcom: ${{ steps.context.outputs.include_meta_qcom }}
      validation_slot: ${{ steps.context.outputs.validation_slot }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r .github/ci/lava-pr-requirements.txt
      - name: Resolve PR revision and queue its validation status
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_REVISION: ${{ inputs.revision }}
          SUBMIT_REQUEST: ${{ inputs.submit }}
          INCLUDE_META_QCOM: ${{ inputs.include_meta_qcom }}
        run: python .github/workflows/lava_pr_validation.py begin
      - name: Save request context before waiting for a validation runner
        if: always() && steps.context.outputs.sha != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lava-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lava-output/context.json
            lava-output/controller-errors.json
          if-no-files-found: error
          retention-days: 30

  validate:
    needs: request
    if: github.repository == 'qualcomm-linux/qcom-linux-testkit' && github.ref == 'refs/heads/main'
    environment: lava-foundries
    runs-on: ubuntu-latest
    # Three native queues cap validation jobs across manual and approval runs.
    # Pending jobs wait without occupying a hosted runner or replacing each other.
    concurrency:
      group: testkit-lava-foundries-slot-${{ needs.request.outputs.validation_slot }}
      cancel-in-progress: false
      queue: max
    # Hosted jobs are limited to six hours. The five-hour request deadline
    # leaves time for preparation, cancellation, collection and artifact upload.
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      request_attempt: ${{ steps.prepare.outputs.request_attempt }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VALIDATION_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Install controller dependencies
        run: python -m pip install -r .github/ci/lava-pr-requirements.txt

      - name: Download resolved PR context
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: lava-context-${{ github.run_id }}-${{ needs.request.outputs.context_attempt }}
          path: lava-output
      - name: Mark the PR validation in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/workflows/lava_pr_validation.py start

      - name: Check LAVA identity and artifact access configuration
        env:
          LAVATOKEN: ${{ secrets.LAVATOKEN }}
          LAVA_ARTIFACT_TOKEN_NAME: ${{ vars.FOUNDRIES_ARTIFACT_TOKEN_NAME || 'Q_QLI_S3_TOKEN' }}
        run: python .github/workflows/lava_pr_validation.py preflight

      - name: Resolve meta-qcom target list and plan revision
        id: plans
        env:
          GH_TOKEN: ${{ github.token }}
          META_QCOM_READ_TOKEN: ${{ secrets.META_QCOM_READ_TOKEN }}
          IMAGE_DISTRO: ${{ inputs.distro }}
          TARGETS: ${{ inputs.targets }}
        run: python .github/workflows/lava_pr_validation.py plans

      - name: Checkout resolved meta-qcom PR templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: qualcomm-linux/lava-test-plans
          ref: ${{ steps.plans.outputs.plans_revision }}
          path: lava-test-plans
          persist-credentials: false

      - name: Install the selected plan renderer
        run: python -m pip install ./lava-test-plans

      - name: Prepare selected PR tests and optional meta-qcom baseline
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          META_QCOM_READ_TOKEN: ${{ secrets.META_QCOM_READ_TOKEN }}
          QLI_S3_TOKEN: ${{ secrets.QLI_S3_TOKEN }}
          LAVATOKEN: ${{ secrets.LAVATOKEN }}
          LAVA_ARTIFACT_TOKEN_NAME: ${{ vars.FOUNDRIES_ARTIFACT_TOKEN_NAME || 'Q_QLI_S3_TOKEN' }}
          LAVA_PLANS_PATH: lava-test-plans
          PR_NUMBER: ${{ inputs.pr }}
          TARGETS: ${{ inputs.targets }}
          PR_REVISION: ${{ needs.request.outputs.sha }}
          IMAGE_DISTRO: ${{ inputs.distro }}
          IMAGE_TYPE: ${{ inputs.image_type }}
          NIGHTLY_RUN_ID: ${{ inputs.nightly_run }}
          TEST_SELECTIONS: ${{ inputs.selections }}
          TEST_NAMES: ${{ inputs.test_names }}
          INCLUDE_META_QCOM: ${{ needs.request.outputs.include_meta_qcom }}
          SUBMIT_REQUEST: ${{ inputs.submit }}
        run: python .github/workflows/lava_pr_validation.py prepare

      - name: Validate preparation-only job definitions
        if: ${{ !inputs.submit }}
        env:
          LAVATOKEN: ${{ secrets.LAVATOKEN }}
        run: python .github/workflows/lava_pr_validation.py validate

      # Publish before submitting. The independent finalizer can recover IDs
      # from LAVA metadata even if this runner disappears during a POST.
      - name: Save immutable request
        id: request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lava-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lava-output/manifest.json
            lava-output/target-matrix.json
            lava-output/jobs/
          if-no-files-found: error
          retention-days: 30

      - name: Submit all prepared LAVA jobs and await results
        if: inputs.submit
        env:
          LAVATOKEN: ${{ secrets.LAVATOKEN }}
        run: python .github/workflows/lava_pr_validation.py run

      - name: Reconcile owned LAVA jobs and collect results
        if: always() && steps.request.outcome == 'success' && inputs.submit
        timeout-minutes: 10
        env:
          LAVATOKEN: ${{ secrets.LAVATOKEN }}
        run: python .github/workflows/lava_pr_validation.py collect

      - name: Save collected LAVA evidence
        if: always() && steps.request.outcome == 'success' && inputs.submit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lava-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: lava-output/results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary source snapshots
        if: always()
        run: python .github/workflows/lava_pr_validation.py cleanup

      - name: Save controller progress
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lava-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lava-output/execution.json
            lava-output/target-matrix.json
            lava-output/controller-errors.json
            lava-output/scheduling.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report controller status
        if: always()
        env:
          CONTROLLER_STATUS: ${{ job.status }}
          REQUEST_READY: ${{ steps.request.outcome == 'success' && inputs.submit }}
          SUBMIT_REQUEST: ${{ inputs.submit }}
        run: |
          {
            printf 'LAVA validation controller: **%s**.\n\n' "$CONTROLLER_STATUS"
            if [ "$REQUEST_READY" = 'true' ]; then
              printf 'Collected evidence is retained for the hosted results publisher.\n'
            elif [ "$SUBMIT_REQUEST" = 'true' ]; then
              printf 'No hardware jobs were submitted. The immutable submission request was not saved.\n'
            else
              printf 'Preparation-only request. No hardware jobs were submitted.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  results:
    needs: [request, validate]
    if: >-
      always() &&
      github.repository == 'qualcomm-linux/qcom-linux-testkit' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
      # Allow the publisher to finish checks created by older controller runs.
      checks: write
    uses: $/.github/workflows/lava-pr-results.yml
    with:
      validation_run: ${{ github.run_id }}
      validation_attempt: ${{ needs.validate.outputs.request_attempt || github.run_attempt }}
      validation_result: ${{ needs.request.result != 'success' && needs.request.result || needs.validate.result }}
      validation_pr: ${{ inputs.pr }}
      validation_sha: ${{ needs.request.outputs.sha }}
      submit_requested: ${{ inputs.submit }}
