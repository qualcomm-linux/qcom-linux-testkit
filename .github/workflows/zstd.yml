name: Zstd Archive Release

# Grant write access so we can create releases & upload assets
permissions:
  contents: write

on:
  push:
    # Only run on semver-style tags like v1.2.3
    tags:
      - 'v*.*.*'
  workflow_dispatch: # (Optional) allows manual runs

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}" # e.g. v1.2.3
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create .tar.zst archive
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}  # ✅ safe: env var, not inline expansion
        run: |
          git archive --format=tar \
            --prefix=qcom-linux-testkit/ \
            "$TAG_NAME" \
            | zstd -o "${GITHUB_WORKSPACE}/${TAG_NAME}.tar.zst"

      - name: Publish GitHub release and archive
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" "${GITHUB_WORKSPACE}/${TAG_NAME}.tar.zst" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Release $TAG_NAME" \
            --notes ""
