# qcom-linux-testkit command-to-package map
#
# Format:
# os-id:command=package package2 ...
# provider:command=package package2 ...
# os-id:TESTNAME:command=package package2 ...
# provider:TESTNAME:command=package package2 ...
# os-id:package-set:<set-name>=package package2 ...
# provider:package-set:<set-name>=package package2 ...
#
# Lookup order for command dependencies:
# 1. os-id:TESTNAME:command
# 2. provider:TESTNAME:command
# 3. os-id:command
# 4. provider:command
#
# Lookup order for package sets:
# 1. os-id:package-set:<set-name>
# 2. provider:package-set:<set-name>
#
# Do not assume command name equals package name.

# ---------------------------------------------------------------------------
# Common apt provider mappings.
# Applies to Debian/Ubuntu apt-based rootfs.
# ---------------------------------------------------------------------------

apt:modetest=libdrm-tests
apt:kmscube=kmscube
apt:glmark2=glmark2
apt:v4l2-ctl=v4l-utils
apt:media-ctl=v4l-utils
apt:yavta=yavta
apt:jq=jq
apt:wget=wget
apt:curl=curl
apt:tar=tar
apt:unzip=unzip
apt:stress-ng=stress-ng
apt:iperf3=iperf3
apt:bluetoothctl=bluez
apt:bluetoothd=bluez
apt:hciconfig=bluez
apt:hcitool=bluez
apt:l2ping=bluez
apt:btmgmt=bluez
apt:rfkill=rfkill
apt:expect=expect
apt:pgrep=procps
apt:killall=psmisc
apt:lsmod=kmod
apt:modprobe=kmod
apt:gst-launch-1.0=gstreamer1.0-tools
apt:gst-inspect-1.0=gstreamer1.0-tools
apt:efivar=efivar

# ---------------------------------------------------------------------------
# Ubuntu Bluetooth userspace stack.
#
# Ubuntu Server installs this package set before running the current Bluetooth
# validation tests. Ubuntu Desktop uses its image-provided stack and skips
# package installation.
#
# PipeWire, WirePlumber, and libspa-0.2-bluetooth provide the BlueZ media
# endpoint/profile integration validated as part of the Ubuntu BT stack.
# ---------------------------------------------------------------------------

ubuntu:package-set:bluetooth=bluez pipewire wireplumber libspa-0.2-bluetooth alsa-utils

# ---------------------------------------------------------------------------
# Weston compositor and example-client mappings.
#
# Debian and Ubuntu provide the Weston compositor and example clients from
# the weston package.
# ---------------------------------------------------------------------------
 
apt:weston=weston
apt:weston-simple-egl=weston
apt:weston-simple-shm=weston
apt:weston-clickdot=weston
apt:weston-cliptest=weston
apt:weston-editor=weston
apt:weston-flower=weston
apt:weston-resizor=weston
apt:weston-scaler=weston
apt:weston-smoke=weston
apt:package-set:weston-runtime=weston
 
# Common runtime used by Weston compositor and onscreen client validation.
# Graphics implementation packages remain in the graphics-base or graphics
# package sets.
apt:package-set:weston-runtime=weston libdrm-tests mesa-utils

# ---------------------------------------------------------------------------
# X11 graphics validation package sets.
#
# These sets are intentionally split by capability so the runner installs only
# what the selected subtests require.
# ---------------------------------------------------------------------------

# X11 display inspection and session validation.
debian:package-set:graphics-x11-display=x11-utils x11-xserver-utils
apt:package-set:graphics-x11-display=x11-utils x11-xserver-utils

# Optional external fullscreen window handling.
debian:package-set:graphics-x11-fullscreen=xdotool wmctrl
apt:package-set:graphics-x11-fullscreen=xdotool wmctrl

# Mesa GLX, EGL and OpenGL ES utilities.
debian:package-set:graphics-x11-mesa=mesa-utils
apt:package-set:graphics-x11-mesa=mesa-utils

# X11 OpenGL and OpenGL ES glmark2 binaries.
debian:package-set:graphics-x11-glmark2=glmark2-x11 glmark2-es2-x11
apt:package-set:graphics-x11-glmark2=glmark2-x11 glmark2-es2-x11

# GStreamer X11, XVideo and EGL/OpenGL display support.
debian:package-set:graphics-x11-gstreamer=gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-x gstreamer1.0-gl
apt:package-set:graphics-x11-gstreamer=gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-x gstreamer1.0-gl

# Test-specific command recovery where the Debian package name differs from the
# executable name.
debian:X11_Glmark2:glmark2=glmark2-x11
debian:X11_Glmark2:glmark2-es2=glmark2-es2-x11

# Common X11 and Mesa command recovery for apt-based images.
apt:xdpyinfo=x11-utils
apt:xwininfo=x11-utils
apt:xprop=x11-utils
apt:xvinfo=x11-utils
apt:xrandr=x11-xserver-utils
apt:glxinfo=mesa-utils
apt:glxgears=mesa-utils
apt:eglinfo=mesa-utils
apt:es2_info=mesa-utils
apt:es2gears_x11=mesa-utils
apt:eglgears_x11=mesa-utils
apt:egltri_x11=mesa-utils
apt:xdotool=xdotool
apt:xwininfo=x11-utils
apt:wmctrl=wmctrl

