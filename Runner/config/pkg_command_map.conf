# ---------------------------------------------------------------------------
# Qualcomm FastRPC package set.
#
# Used by tests that explicitly call:
# pkg_ensure_package_set fastrpc
# or:
# pkg_ensure_optional_package_set fastrpc ...
#
# No qcom-distro/rpm mapping is provided, so Yocto remains no-op unless a
# supported mapping is added later.
# ---------------------------------------------------------------------------

debian:package-set:fastrpc=fastrpc-support fastrpc-tests
ubuntu:package-set:fastrpc=fastrpc-support fastrpc-tests

# ---------------------------------------------------------------------------
# Qualcomm MinkIPC runtime and test packages.
#
# Debian and Ubuntu MinkIPC suites automatically recover this package set from
# qli-staging before validation. The current qli-staging packages are published
# in the trixie suite for both apt-based test images.
#
# The package set intentionally contains only runtime components used by the
# tests. Development files, debug symbols, the IDL compiler, and rpmb_client
# are not required.
# ---------------------------------------------------------------------------

debian:package-set:minkipc=libminkadaptor0 libminkteec1 minkipc-qteesupplicant minkipc-tests
ubuntu:package-set:minkipc=libminkadaptor0 libminkteec1 minkipc-qteesupplicant minkipc-tests

debian:smcinvoke_client=minkipc-tests
debian:gp_test_client=minkipc-tests
debian:qtee_supplicant=minkipc-qteesupplicant
debian:sfs_config=minkipc-qteesupplicant

ubuntu:smcinvoke_client=minkipc-tests
ubuntu:gp_test_client=minkipc-tests
ubuntu:qtee_supplicant=minkipc-qteesupplicant
ubuntu:sfs_config=minkipc-qteesupplicant

# ---------------------------------------------------------------------------
# Qualcomm QTEE PKCS#11 validation packages.
#
# xtest-qtee depends on libckqteec0 and the MinkIPC client libraries. The
# qteesupplicant package is listed explicitly because the PKCS#11 Trusted
# Application needs the running QTEE listener services during validation.
#
# These packages are currently recovered from qli-staging by the PKCS#11
# runner on Debian and Ubuntu. Yocto, CentOS, and other distributions continue
# to use image-provided components until confirmed package mappings exist.
# ---------------------------------------------------------------------------

debian:package-set:minkipc-pkcs11=minkipc-qteesupplicant xtest-qtee
ubuntu:package-set:minkipc-pkcs11=minkipc-qteesupplicant xtest-qtee

debian:xtest_qtee=xtest-qtee
ubuntu:xtest_qtee=xtest-qtee

# ---------------------------------------------------------------------------
# Qualcomm userspace-resource-manager package set.
#
# Used by tests that explicitly call:
#   pkg_ensure_required_package_set_present urm
#
# The runner only checks that the required package-set definition exists.
# No qcom-distro/rpm mapping is currently provided for this package set, and
# absent mappings are intentionally ignored by the runner. As a result, Yocto
# remains a no-op unless a supported mapping is added in the future.
# ---------------------------------------------------------------------------

debian:package-set:urm=userspace-resource-manager userspace-resource-manager-tests
ubuntu:package-set:urm=userspace-resource-manager userspace-resource-manager-tests

# ---------------------------------------------------------------------------
# Qualcomm Graphics / Adreno optional overlay package set.
#
# Installed only when the test explicitly requests optional overlay recovery,
# for example:
# ./run.sh --overlay
#
# Currently available from qli-staging. Once promoted to qli, only the source
# selection in the caller needs to change. The package-set name remains graphics.
#
# DKMS packages are skipped by lib_pkg_provider.sh when matching kernel headers
# are unavailable. Remaining userspace packages continue to install.
#
# No qcom-distro/rpm mapping is provided, so Yocto remains no-op.
# ---------------------------------------------------------------------------

# Qualcomm proprietary graphics overlay package set.
debian:package-set:graphics=kgsl-dkms adreno-common libgbm-msm1 adreno-gles1 adreno-gles2 adreno-egl1 adreno-vulkan-icd adreno-opencl-icd adreno-opencl-dev

# Upstream Debian Mesa/freedreno userspace required by the default KMSCube run.
debian:package-set:graphics-base=libegl-mesa0 libgl1-mesa-dri libgbm1 libegl1 libgles2 mesa-utils

# TODO on ubuntu
ubuntu:package-set:graphics=kgsl-dkms adreno-common adreno-gles1 adreno-gles2 adreno-egl1 adreno-vulkan-icd adreno-opencl-icd adreno-opencl-dev

# ---------------------------------------------------------------------------
# Audio validation package recovery.
#
# Debian and Ubuntu Audio tests use their distro-provided base Audio stack.
#
# Qualcomm AudioReach packages are installed only when --overlay is explicitly
# requested.
#
# Ubuntu uses the apt sources already configured by the distro image. Audio
# package preparation must not add, replace, or rewrite Ubuntu apt sources.
#
# No rpm, opkg, qcom-distro, or generic provider package-set mapping is
# provided. Yocto and other embedded images continue using their image-provided
# Audio stack without package recovery.
# ---------------------------------------------------------------------------
 
# ---------------------------------------------------------------------------
# Debian base Audio stack.
# ---------------------------------------------------------------------------
 
debian:package-set:audio-base=alsa-utils pipewire-bin wireplumber pulseaudio-utils curl wget ca-certificates tar gzip
 
# ---------------------------------------------------------------------------
# Ubuntu base Audio stack.
#
# pipewire:
#   PipeWire daemon and service files.
#
# pipewire-bin:
#   pw-play, pw-record, pw-cli and other PipeWire command-line tools.
#
# pipewire-audio:
#   Recommended Ubuntu PipeWire audio integration, including ALSA and
#   PulseAudio compatibility components.
#
# wireplumber:
#   PipeWire session and policy manager providing wpctl.
#
# pulseaudio-utils:
#   pactl, paplay and parecord compatibility commands.
#
# curl, wget, ca-certificates, tar and gzip:
#   Required by AudioPlayback to download and extract AudioClips.tar.gz.
# ---------------------------------------------------------------------------
 
ubuntu:package-set:audio-base=alsa-utils alsa-ucm-conf curl ca-certificates tar gzip
 
# ---------------------------------------------------------------------------
# Debian Qualcomm AudioReach overlay stack.
#
# The overlay package set must be complete by itself because --overlay checks
# the "audio" package set directly; it does not install "audio-base" first.
# ---------------------------------------------------------------------------
 
debian:package-set:audio=alsa-utils pipewire-bin wireplumber pulseaudio-utils curl ca-certificates tar gzip audioreach-pipewire-plugin audioreach-kernel-dkms audioreach-config
 
# ---------------------------------------------------------------------------
# Ubuntu Qualcomm AudioReach overlay stack.
#
# Ubuntu uses the existing distro-configured apt sources. Do not configure a
# Debian, qli, or qli-staging source from the Audio test.
#
# This package set includes the complete Ubuntu base Audio stack because
# --overlay checks only the "audio" package set.
# ---------------------------------------------------------------------------
 
ubuntu:package-set:audio=alsa-utils pipewire pipewire-bin pipewire-audio wireplumber pulseaudio-utils curl wget ca-certificates tar gzip audioreach-pipewire-plugin audioreach-kernel-dkms audioreach-config
 
# ---------------------------------------------------------------------------
# Command recovery used by check_dependencies()/pkg_ensure_command().
#
# These apt-provider mappings apply to Debian and Ubuntu.
# ---------------------------------------------------------------------------
 
apt:aplay=alsa-utils
apt:arecord=alsa-utils
apt:amixer=alsa-utils
apt:alsaucm=alsa-utils
apt:wpctl=wireplumber
apt:pipewire=pipewire
apt:pw-play=pipewire-bin
apt:pw-record=pipewire-bin
apt:pactl=pulseaudio-utils
apt:paplay=pulseaudio-utils
apt:parecord=pulseaudio-utils
apt:curl=curl
apt:wget=wget
apt:tar=tar

# ---------------------------------------------------------------------------
# Qualcomm Sensors runtime and test packages.
#
# Important:
# - Never use wildcard package names.
# - Never install dbgsym packages.
# - The six qcom-sensors-*-dev packages are temporarily required because
#   ssc_sensor_info fails to load its sensor libraries without the unversioned
#   library links currently shipped by those development packages.
# - qcom-sensing-hub-dev remains required for the sensing-hub development
#   library links.
# - libqcsi1 is a required runtime library.
# ---------------------------------------------------------------------------

debian:package-set:sensors=qcom-sensing-hub qcom-sensing-hub-dev libqcsi1 qcom-sensors-api qcom-sensors-api-dev qcom-sensors-core qcom-sensors-core-dev qcom-sensors-registry qcom-sensors-registry-dev qcom-sensors-services qcom-sensors-services-dev qcom-sensors-test-core qcom-sensors-test-core-dev qcom-sensors-test-apps qcom-sensors-test-apps-dev

ubuntu:package-set:sensors=qcom-sensing-hub qcom-sensing-hub-dev libqcsi1 qcom-sensors-api qcom-sensors-api-dev qcom-sensors-core qcom-sensors-core-dev qcom-sensors-registry qcom-sensors-registry-dev qcom-sensors-services qcom-sensors-services-dev qcom-sensors-test-core qcom-sensors-test-core-dev qcom-sensors-test-apps qcom-sensors-test-apps-dev

# Keep CentOS limited to confirmed RPM package names.
# Debian -dev names must not be copied to RPM systems. Add RPM -devel packages
# only after confirming their exact names in the enabled CentOS repository.
centos:package-set:sensors=qcom-sensing-hub qcom-sensors-api qcom-sensors-core qcom-sensors-registry qcom-sensors-services qcom-sensors-test-core qcom-sensors-test-apps

