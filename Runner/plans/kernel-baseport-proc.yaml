metadata:
    format: Lava-Test Test Definition 1.0
    name: kernel-baseport-proc
    description: "Core kernel proc, sysfs, RCU, workqueue, and memory validation present on this branch"
    maintainer:
        - vnarapar@qti.qualcomm.com
    os:
        - openembedded
    scope:
        - functional
    devices:
        - rb3gen2

run:
    steps:
        - REPO_PATH=$(pwd)
        - export REPO_PATH
        - export CHECK_DEPS_RECOVER=0 TESTKIT_IMAGE_ONLY=1
        - cd "$REPO_PATH/Runner/suites/Kernel/Baseport/RCU_Validation" || exit 1
        - rm -f "RCU_Validation.res"
        - ./run.sh || true
        - >-
            "$REPO_PATH/Runner/utils/send-to-lava.sh" "RCU_Validation.res" --strict --expected-testcase-id "RCU_Validation" || lava-test-case "RCU_Validation_result_publication" --result fail
        - cd "$REPO_PATH/Runner/suites/Kernel/Baseport/Workqueue_Validation" || exit 1
        - rm -f "Workqueue_Validation.res"
        - ./run.sh || true
        - >-
            "$REPO_PATH/Runner/utils/send-to-lava.sh" "Workqueue_Validation.res" --strict --expected-testcase-id "Workqueue_Validation" || lava-test-case "Workqueue_Validation_result_publication" --result fail
