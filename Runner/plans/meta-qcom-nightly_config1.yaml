metadata:
    format: Lava-Test Test Definition 1.0
    name: Meta-qcom Config1 Tesplan
    description: "Nightly testplan for Kernel meta-qcom premerge"
    maintainer:
        - vnarapar@qti.qualcomm.com
    os:
        - openembedded
    scope:
        - functional
    devices:
        - rb3gen2


run:
    steps:
        - REPO_PATH="$PWD"
        - cd "$REPO_PATH/Runner"
        - export TMPDIR="$PWD"
        - tar -xzvf /Lava_binaries/AudioClips.tar.gz -C /Lava_binaries || lava-test-case AudioClips_setup --result fail
        - tar -xzvf /Lava_binaries/video_clips_iris.tar.gz -C "$PWD/suites/Multimedia/Video/Video_V4L2_Runner/" || lava-test-case Video_V4L2_assets_setup --result fail
        - chmod -R a+rX /Lava_binaries
        - chmod -R a+rX "$PWD/suites/Multimedia/Video/Video_V4L2_Runner"
        - export PATH="$PATH:/Lava_binaries"
        - ls -la /Lava_binaries/AudioClips/
        - ls -la "$PWD/suites/Multimedia/Video/Video_V4L2_Runner"
        # GStreamer uses a WebM fixture, the Iris archive is not a substitute.
        - |
          if [ -f /Lava_binaries/video_clips_gst.tar.gz ]; then
              tar -xzf /Lava_binaries/video_clips_gst.tar.gz -C "$REPO_PATH/Runner/suites/Multimedia/GSTreamer/Video/Video_Encode_Decode" || lava-test-case GStreamer_video_assets_setup --result fail
          fi
        # cacheflush, hrtimer and ipi have no runners in this checkout.
        # See README.md for the remaining coverage gaps.
        - cd "$REPO_PATH/Runner/suites/Connectivity/Bluetooth/BT_FW_KMD_Service"
        - export TMPDIR="$PWD"
        - rm -f "BT_FW_KMD_Service.res"
        - ./run.sh || true
        - >-
          "$REPO_PATH/Runner/utils/send-to-lava.sh" "BT_FW_KMD_Service.res" --strict || lava-test-case BT_FW_KMD_Service_result_publication --result fail
        - cd "$REPO_PATH/Runner/suites/Connectivity/Bluetooth/BT_ON_OFF"
        - export TMPDIR="$PWD"
        - rm -f "BT_ON_OFF.res"
        - ./run.sh --adapter '' --power-cycle-delay 10 --power-on-attempts 2 --power-on-retry-delay 10 --restart-service-on-retry 1 || true
        - >-
          "$REPO_PATH/Runner/utils/send-to-lava.sh" "BT_ON_OFF.res" --strict || lava-test-case BT_ON_OFF_result_publication --result fail
