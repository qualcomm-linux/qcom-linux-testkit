metadata:
  name: ethernet-inventory-validation
  format: "Lava-Test Test Definition 1.0"
  description: "Inventory Ethernet interfaces, drivers, PHY and queue topology, including runtime-gated QPS615 readiness, without changing network configuration."
  os:
    - linux
  scope:
    - functional

params:
  ETH_INTERFACE: ""

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Connectivity/Ethernet/Ethernet_Inventory_Validation
    - ./run.sh --interface "${ETH_INTERFACE}" || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh Ethernet_Inventory_Validation.res || true
