metadata:
  name: Buses
  format: "Lava-Test Test Definition 1.0"
  description: "Validate I2C runtime state, adapter capabilities, and explicitly selected transfers"
  os:
    - linux
  scope:
    - functional

params:
  I2C_LEGACY_TEST_ENABLE: "auto"
  I2C_TEST_ADAPTER: "auto"
  I2C_TEST_TIMEOUT: "15"
  I2C_DMESG_STRICT: "0"
  I2C_TOOLS_TIMEOUT: "10"
  I2C_SCAN_ENABLE: "0"
  I2C_SCAN_MODE: "quick"
  I2C_READ_ADDRESS: ""
  I2C_READ_REGISTER: ""
  I2C_READ_MODE: "b"
  I2C_READ_EXPECTED: ""
  I2C_READ_MASK: ""
  I2C_WRITE_ADDRESS: ""
  I2C_WRITE_REGISTER: ""
  I2C_WRITE_VALUE: ""
  I2C_WRITE_MODE: "b"
  I2C_ALLOW_WRITE: "0"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/Buses
    - ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh Buses.res
