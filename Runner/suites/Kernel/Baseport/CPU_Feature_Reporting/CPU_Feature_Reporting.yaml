metadata:
  name: CPU_Feature_Reporting
  format: Lava-Test Test Definition 1.0
  description: Validate Arm64 kernel feature reporting with existing ramdisk tools and reuse native idregs validation when available.
  os:
  - linux
  scope:
  - functional
params:
  TIMEOUT: "60"
  IDREGS: null
  FEATURE_TABLE: null
  EXPECT: null
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/CPU_Feature_Reporting
    - ./run.sh --timeout "$TIMEOUT" ${IDREGS:+--idregs "${IDREGS}"} ${FEATURE_TABLE:+--feature-table "${FEATURE_TABLE}"} ${EXPECT:+--expect "${EXPECT}"} || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh CPU_Feature_Reporting.res
