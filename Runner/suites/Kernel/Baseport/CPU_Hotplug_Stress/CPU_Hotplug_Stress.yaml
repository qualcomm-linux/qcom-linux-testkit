metadata:
  name: CPU_Hotplug_Stress
  format: Lava-Test Test Definition 1.0
  description: Repeated secondary-CPU hotplug, optional batch and concurrent phases, with online-mask restoration.
  os:
  - linux
  scope:
  - functional
params:
  TIMEOUT: "60"
  EXERCISE: "1"
  ROUNDS: "3"
  BATCH: null
  CONCURRENT: null
  LOAD_SECONDS: null
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/CPU_Hotplug_Stress
    - ./run.sh --timeout "$TIMEOUT" --exercise "$EXERCISE" --rounds "$ROUNDS" ${BATCH:+--batch "${BATCH}"} ${CONCURRENT:+--concurrent "${CONCURRENT}"} ${LOAD_SECONDS:+--load-seconds "${LOAD_SECONDS}"} || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh CPU_Hotplug_Stress.res
