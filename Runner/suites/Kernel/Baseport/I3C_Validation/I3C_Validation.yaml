metadata:
  name: I3C_Validation
  format: "Lava-Test Test Definition 1.0"
  description: "Validate direct Linux I3C evidence without treating subsystem health as transport proof"
  os:
    - linux
  scope:
    - functional

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/I3C_Validation
    - ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh I3C_Validation.res
