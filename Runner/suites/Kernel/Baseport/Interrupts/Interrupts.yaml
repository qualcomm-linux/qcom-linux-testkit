metadata:
    format: Lava-Test Test Definition 1.0
    name: interrupts
    description: "Test basic CPU interrupts features"
    maintainer:
        - vnarapar@qti.qualcomm.com
    os:
        - linux
    scope:
        - functional

params:
    INTERRUPTS_WAIT_TIMEOUT_S: "auto"
    INTERRUPTS_POLL_INTERVAL_S: "2"

run:
    steps:
        - REPO_PATH=$PWD
        - cd Runner/suites/Kernel/Baseport/Interrupts
        - INTERRUPTS_WAIT_TIMEOUT_S="${INTERRUPTS_WAIT_TIMEOUT_S}" INTERRUPTS_POLL_INTERVAL_S="${INTERRUPTS_POLL_INTERVAL_S}" ./run.sh || true
        - $REPO_PATH/Runner/utils/send-to-lava.sh Interrupts.res
