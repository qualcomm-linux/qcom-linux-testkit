metadata:
  name: Remoteproc_Lifecycle_Validation
  format: Lava-Test Test Definition 1.0
  description: Runtime lifecycle expectations and retained evidence of recovered remoteproc crashes.
  os:
  - linux
  scope:
  - functional
params:
  TIMEOUT: "60"
  PROCESSORS: null
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/Remoteproc_Lifecycle_Validation
    - ./run.sh --timeout "$TIMEOUT" ${PROCESSORS:+--processors "${PROCESSORS}"} || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh Remoteproc_Lifecycle_Validation.res
