metadata:
  name: Remoteproc_Crash_Recovery
  format: Lava-Test Test Definition 1.0
  description: Inject one synthetic crash in selected runtime DSPs and verify automatic recovery.
  os:
  - linux
  scope:
  - functional
params:
  TIMEOUT: "30"
  EXERCISE: "1"
  SUBSYSTEM: "dsp"
  ROUNDS: "1"
  PROCESSORS: null
  STABLE_SECONDS: null
  MODE: "crash"
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/Remoteproc_Restart_Validation
    - ./run.sh --timeout "$TIMEOUT" --exercise "$EXERCISE" --subsystem "$SUBSYSTEM" --rounds "$ROUNDS" ${PROCESSORS:+--processors "${PROCESSORS}"} ${MODE:+--mode "${MODE}"} ${STABLE_SECONDS:+--stable-seconds "${STABLE_SECONDS}"} || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh Remoteproc_Restart_Validation.res
