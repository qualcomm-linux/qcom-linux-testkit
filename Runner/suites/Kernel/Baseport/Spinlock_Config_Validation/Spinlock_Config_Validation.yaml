metadata:
  name: spinlock-config-validation
  format: "Lava-Test Test Definition 1.0"
  description: "Validate SMP/spinlock-related kernel configs and that the lockup detector / locking selftest surfaces are coherent. Debug lock options are optional."
  os:
    - linux
  scope:
    - functional
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/Spinlock_Config_Validation
    - ./run.sh
    - $REPO_PATH/Runner/utils/send-to-lava.sh Spinlock_Config_Validation.res
