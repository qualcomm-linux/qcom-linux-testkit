metadata:
  name: UART_Loopback_Validation
  format: "Lava-Test Test Definition 1.0"
  description: "Run bounded exact-payload loopback on an auto-detected or selected safe UART"
  os:
    - linux
  scope:
    - functional

params:
  UART_DEVICE: ""
  UART_BAUDS: "auto"
  UART_PAYLOAD_BYTES: "4096"
  UART_LOOPBACK_TIMEOUT: "10"
  UART_LOOPBACK_FIXTURE: "0"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/UART_Loopback_Validation
    - UART_DEVICE="${UART_DEVICE}" UART_BAUDS="${UART_BAUDS}" UART_PAYLOAD_BYTES="${UART_PAYLOAD_BYTES}" UART_LOOPBACK_TIMEOUT="${UART_LOOPBACK_TIMEOUT}" UART_LOOPBACK_FIXTURE="${UART_LOOPBACK_FIXTURE}" ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh UART_Loopback_Validation.res
