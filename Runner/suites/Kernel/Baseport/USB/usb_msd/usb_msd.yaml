metadata:
  name: usb_msd
  format: "Lava-Test Test Definition 1.0"
  description: "Validate USB mass-storage binding, block-device creation, and read access."
  os:
    - linux
  scope:
    - functional

params:
  USB_MSD_READ_VERIFY: "1"
  USB_MSD_WAIT_SECONDS: "10"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/USB/usb_msd
    - ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh usb_msd.res
