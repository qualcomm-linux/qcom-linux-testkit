metadata:
  name: usb_uvc
  format: "Lava-Test Test Definition 1.0"
  description: "This shell script executes on the DUT (Device-Under-Test) and verifies enumeration of connected USB Video Class (UVC) devices and creation of /dev/video* nodes."
  os:
    - linux
  scope:
    - functional

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/USB/usb_uvc
    - ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh usb_uvc.res
