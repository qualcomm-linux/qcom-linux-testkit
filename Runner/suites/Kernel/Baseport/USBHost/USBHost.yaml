metadata:
  name: usb-host
  format: "Lava-Test Test Definition 1.0"
  description: "Validate USB host controllers, connected devices, interface drivers, speeds, and runtime power."
  os:
    - linux
  scope:
    - functional

params:
  USB_DMESG_STRICT: "0"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/USBHost
    - ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh USBHost.res || true
