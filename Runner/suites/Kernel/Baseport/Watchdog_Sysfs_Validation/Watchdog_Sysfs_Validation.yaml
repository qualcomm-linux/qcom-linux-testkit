metadata:
  name: watchdog-sysfs-validation
  format: "Lava-Test Test Definition 1.0"
  description: "Validate watchdog class sysfs identity, state, timeout, status, and bootstatus without arming the hardware watchdog."
  os:
    - linux
  scope:
    - functional
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/Watchdog_Sysfs_Validation
    - ./run.sh
    - $REPO_PATH/Runner/utils/send-to-lava.sh Watchdog_Sysfs_Validation.res
