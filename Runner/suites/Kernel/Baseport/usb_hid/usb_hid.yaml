metadata:
  name: usb_hid
  format: "Lava-Test Test Definition 1.0"
  description: "Validate connected USB HID interfaces and kernel-driver binding."
  os:
    - linux
  scope:
    - functional

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Baseport/usb_hid
    - ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh usb_hid.res
