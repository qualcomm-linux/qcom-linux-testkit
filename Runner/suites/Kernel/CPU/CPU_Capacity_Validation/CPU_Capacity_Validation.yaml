metadata:
  name: cpu-capacity-validation
  format: "Lava-Test Test Definition 1.0"
  description: "Validate per-CPU capacity sysfs used by Energy Aware Scheduling on big.LITTLE / multi-gear Qualcomm SoCs."
  os:
    - linux
  scope:
    - functional
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/CPU/CPU_Capacity_Validation
    - ./run.sh
    - $REPO_PATH/Runner/utils/send-to-lava.sh CPU_Capacity_Validation.res
