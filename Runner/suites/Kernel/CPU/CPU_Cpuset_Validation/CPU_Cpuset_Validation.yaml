metadata:
  name: cpu-cpuset-validation
  format: "Lava-Test Test Definition 1.0"
  description: "Validate cpuset CPU masks in cgroup v1 or v2, matching the online CPU set."
  os:
    - linux
  scope:
    - functional
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/CPU/CPU_Cpuset_Validation
    - ./run.sh
    - $REPO_PATH/Runner/utils/send-to-lava.sh CPU_Cpuset_Validation.res
