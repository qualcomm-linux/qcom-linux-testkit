metadata:
  name: cpu-smt-isolcpus-validation
  format: "Lava-Test Test Definition 1.0"
  description: "Validate optional SMT control and isolated-CPU sysfs. SKIP when the ABI is absent (typical on many aarch64 images)."
  os:
    - linux
  scope:
    - functional
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/CPU/CPU_SMT_Isolcpus_Validation
    - ./run.sh
    - $REPO_PATH/Runner/utils/send-to-lava.sh CPU_SMT_Isolcpus_Validation.res
