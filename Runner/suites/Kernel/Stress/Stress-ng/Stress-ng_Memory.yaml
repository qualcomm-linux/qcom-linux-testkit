metadata:
  name: Stress-ng_Memory
  format: Lava-Test Test Definition 1.0
  description: Bounded memory stress
  os:
  - linux
  scope:
  - functional
params:
  WORKLOAD: vm
  DURATION: 300
  REPEAT: 1
  MEM_PERCENT: 15
  MEM_HEADROOM_MB: 256
  MEM_CAP_MB: null
  CPU_LIST: null
  VM_KEEP: 1
  TIMEOUT_MARGIN: 120
run:
  steps:
  - REPO_PATH=$PWD
  - cd Runner/suites/Kernel/Stress/Stress-ng
  - rm -f Stress-ng.res
  - set --
  - set -- "$@" --sets "${WORKLOAD}"
  - set -- "$@" --p2 "${DURATION}"
  - set -- "$@" --repeat "${REPEAT}"
  - set -- "$@" --mem-frac "${MEM_PERCENT}"
  - set -- "$@" --mem-headroom-mb "${MEM_HEADROOM_MB}"
  - if [ -n "${MEM_CAP_MB:-}" ]; then set -- "$@" --mem-cap-mb "${MEM_CAP_MB}"; fi
  - if [ -n "${CPU_LIST:-}" ]; then set -- "$@" --cpu-list "${CPU_LIST}"; fi
  - set -- "$@" --vm-keep "${VM_KEEP}"
  - set -- "$@" --timeout-margin "${TIMEOUT_MARGIN}"
  - TESTKIT_IMAGE_ONLY=1 ./run.sh "$@" || true
  - $REPO_PATH/Runner/utils/send-to-lava.sh Stress-ng.res --strict --expected-testcase-id Stress-ng
