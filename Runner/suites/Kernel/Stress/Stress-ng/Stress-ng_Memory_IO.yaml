metadata:
  name: Stress-ng_Memory_IO
  format: "Lava-Test Test Definition 1.0"
  description: "Run the stress-ng VM and disk workload with percentage-based resource sizing"
  os:
    - linux
  scope:
    - functional

params:
  BINARY: null
  MEMORY_IO_SECONDS: 120
  MEM_PERCENT: 15
  DISK_PERCENT: 1
  CPU_LIST: null
  TEMP_LIMIT: null

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Kernel/Stress/Stress-ng
    - rm -f Stress-ng.res
    - set --
    - if [ -n "${BINARY:-}" ]; then set -- "$@" --binary "${BINARY}"; fi
    - TESTKIT_IMAGE_ONLY=1 ./run.sh --sets vmhdd --p2 "${MEMORY_IO_SECONDS}" --mem-frac "${MEM_PERCENT}" --disk-frac "${DISK_PERCENT}" --cpu-list "${CPU_LIST:-}" --temp-limit "${TEMP_LIMIT:-}" "$@" || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh Stress-ng.res --strict --expected-testcase-id Stress-ng
