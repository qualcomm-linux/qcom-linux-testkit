metadata:
  name: audio-record-hamoa-headset
  format: "Lava-Test Test Definition 1.0"
  description: "Audio recording validation for Hamoa headset (headset microphone, SWR_MIC), direct ALSA with hardware mixer profile"
  os:
    - linux
  scope:
    - functional

params:
  CONFIG_NAMES: "record_config1"  # Test specific configs (e.g., "record_config1 record_config2"), default: record_config1
  CONFIG_FILTER: ""  # Filter configs by pattern (e.g., "48KHz" or "2ch"), default: unset
  DURATIONS: ""  # Recording durations: short, medium, long (legacy mode only, not used in config discovery mode), default: unset
  RECORD_SECONDS: "5s"  # Recording duration with unit suffix (e.g., "5s", "10s", "30s"), default: 5s
  LOOPS: 1  # Number of recording loops, default: 1
  TIMEOUT: 0  # Explicit timeout override per loop (e.g., 15s, 0=automatic), default: 0
  AUDIO_RECORD_START_GRACE: 5  # Startup headroom added to the automatic recorder watchdog, default: 5s
  STRICT: 0  # Enable strict mode (fail on any error), default: 0
  DMESG_SCAN: 1  # Scan dmesg for errors after recording, default: 1
  VERBOSE: 0  # Enable verbose logging, default: 0
  RES_SUFFIX: "Hamoa_Headset"  # Suffix for unique result file and log directory (generates AudioRecord_Hamoa_Headset.res and results/AudioRecord_Hamoa_Headset/)
  LAVA_TESTCASE_ID: "AudioRecord_Hamoa_Headset"  # Unique testcase ID written into the .res file for LAVA

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Audio/AudioRecord/
    - DMESG_FLAG=""; [ "${DMESG_SCAN}" = "0" ] && DMESG_FLAG="--no-dmesg"
    - VERBOSE_FLAG=""; [ "${VERBOSE}" = "1" ] && VERBOSE_FLAG="--verbose"
    - ./run.sh --backend alsa --alsa-profile hamoa --device headset --source mic --config-name "${CONFIG_NAMES}" --config-filter "${CONFIG_FILTER}" --record-seconds "${RECORD_SECONDS}" --loops "${LOOPS}" --timeout "${TIMEOUT}" --start-grace "${AUDIO_RECORD_START_GRACE}" --strict "${STRICT}" --res-suffix "${RES_SUFFIX}" --lava-testcase-id "${LAVA_TESTCASE_ID}" ${DMESG_FLAG} ${VERBOSE_FLAG} || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh AudioRecord${RES_SUFFIX:+_${RES_SUFFIX}}.res