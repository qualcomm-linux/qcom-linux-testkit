metadata:
  name: audio-route-playback-displayport
  format: "Lava-Test Test Definition 1.0"
  description: "Validate playback through a dynamically discovered DP or eDP audio route"
  os:
    - linux
  scope:
    - functional

params:
  MIXER_CONTROL: ""
  MIXER_VALUE: ""
  PCM_LABEL: ""
  ALSA_DEVICE: ""
  PLAYBACK_DURATION: "3"
  DMESG_SCAN: "1"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Audio/AudioRoutePlayback/
    - ./run.sh --route displayport --mixer-control "${MIXER_CONTROL}" --mixer-value "${MIXER_VALUE}" --pcm-label "${PCM_LABEL}" --alsa-device "${ALSA_DEVICE}" --duration "${PLAYBACK_DURATION}" --dmesg-scan "${DMESG_SCAN}" --res-suffix DisplayPort --lava-testcase-id AudioRoutePlayback_DisplayPort || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh AudioRoutePlayback_DisplayPort.res
