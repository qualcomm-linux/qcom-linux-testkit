metadata:
  name: kms-addfb-basic
  format: "Lava-Test Test Definition 1.0"
  description: "Validates basic framebuffer creation and destruction using the IGT kms_addfb_basic test suite. Stops any active Weston compositor before running and restores it afterwards."
  os:
    - linux
  scope:
    - functional

params:
  KMS_ADDFB_BASIC_PATH: "/usr/libexec/igt-gpu-tools/kms_addfb_basic"
  IGT_TIMEOUT: "300"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Display/igt-gpu-tools/kms_addfb_basic
    - export IGT_TIMEOUT="${IGT_TIMEOUT}"
    - ./run.sh --kms-addfb-basic-path "${KMS_ADDFB_BASIC_PATH}" || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh kms_addfb_basic.res || true
