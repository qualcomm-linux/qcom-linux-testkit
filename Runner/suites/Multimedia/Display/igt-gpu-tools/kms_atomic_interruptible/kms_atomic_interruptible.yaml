metadata:
  name: kms-atomic-interruptible
  format: "Lava-Test Test Definition 1.0"
  description: "Validates the KMS atomic modesetting API under interrupt-heavy conditions using the IGT kms_atomic_interruptible test suite. Stops any active Weston compositor before running and restores it afterwards."
  os:
    - linux
  scope:
    - functional

params:
  KMS_ATOMIC_INTERRUPTIBLE_PATH: "/usr/libexec/igt-gpu-tools/kms_atomic_interruptible"
  IGT_TIMEOUT: "300"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Display/igt-gpu-tools/kms_atomic_interruptible
    - export IGT_TIMEOUT="${IGT_TIMEOUT}"
    - ./run.sh --kms-atomic-interruptible-path "${KMS_ATOMIC_INTERRUPTIBLE_PATH}" || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh kms_atomic_interruptible.res || true
