metadata:
  name: weston-simple-egl
  format: "Lava-Test Test Definition 1.0"
  description: "Validate the Weston EGL client, renderer path, and synchronized FPS output."
  os:
    - linux
  scope:
    - functional

params:
  DURATION: "30s"
  STOP_GRACE: "3s"
  WAIT_SECS: "10"
  REQUIRE_FPS: "1"
  TIME_SYNC_WAIT: "20"
  CLOCK_STEP_TOLERANCE: "2"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Graphics/weston-simple-egl
    - DURATION="${DURATION}" STOP_GRACE="${STOP_GRACE}" WAIT_SECS="${WAIT_SECS}" REQUIRE_FPS="${REQUIRE_FPS}" TIME_SYNC_WAIT="${TIME_SYNC_WAIT}" CLOCK_STEP_TOLERANCE="${CLOCK_STEP_TOLERANCE}" ./run.sh || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh weston-simple-egl.res || true
