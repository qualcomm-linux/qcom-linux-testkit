metadata:
  name: Video_Runtime_PM_Validation
  format: Lava-Test Test Definition 1.0
  description: Verify hardware decode correctness after an observed runtime suspend and resume.
  os:
    - linux
  scope:
    - functional
params:
  STREAMS: null
  CODEC: "h264"
  FFMPEG: "ffmpeg"
  TIMEOUT: "60"
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Video/Video_Runtime_PM_Validation
    - ./run.sh ${STREAMS:+--streams "${STREAMS}"} ${CODEC:+--codec "${CODEC}"} ${FFMPEG:+--ffmpeg "${FFMPEG}"} ${TIMEOUT:+--timeout "${TIMEOUT}"} || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh Video_Runtime_PM_Validation.res
