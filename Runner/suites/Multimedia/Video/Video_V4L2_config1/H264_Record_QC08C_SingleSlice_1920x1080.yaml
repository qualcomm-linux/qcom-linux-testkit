metadata:
  name: h264-record-qc08c-singleslice-1920x1080
  format: "Lava-Test Test Definition 1.0"
  description: >
    H264 AVC encoder test using QC08C pixel format at 1920x1080 resolution
    with single-slice mode (V4L2_MPEG_VIDEO_MULTI_SLICE_MODE_SINGLE), VBR
    bitrate control at 20Mbps, HIGH profile Level 5.0 (auto-capped to 4.0
    on Shikra via VIDEO_POLICY_SCOPE=all), GOP size 59, MMAP memory type,
    on Qualcomm Linux platforms using iris_v4l2_test.
    Input clip must be pre-staged to /usr/v4l2/input/ on the device.
    Clip: 1080p24_ParkScene_nv12_ubwc.yuv (QC08C/UBWC NV12, 1920x1080).
  os:
    - linux
  scope:
    - functional

params:
  # path to iris_v4l2_test binary
  APP_PATH: "/usr/bin/iris_v4l2_test"
  # JSON config is in the same Video_V4L2_config1/ directory as this YAML.
  # run.steps cd into Video_V4L2_Runner/ so path is relative to that dir.
  CONFIG_PATH: "../Video_V4L2_config1/H264_Record_QC08C_SingleSlice_1920x1080.json"
  # platform is autodetected by the test script (lemans|monaco|kodiak|shikra)
  PLATFORM: ""
  # stack selection: auto|upstream|downstream|base|overlay|both
  VIDEO_STACK: "auto"
  # "all" ensures Shikra Level 4.0 policy is applied to this custom config.
  # "bundled" (default) only rewrites the 4 built-in fixture configs.
  VIDEO_POLICY_SCOPE: "all"
  # output check against an FFmpeg software decode: off (default) | on
  VIDEO_VERIFY: "off"
  VIDEO_MIN_PSNR: 25
  LOGLEVEL: 15
  RETRY_ON_FAIL: 5
  POST_TEST_SLEEP: 10

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Video/Video_V4L2_Runner/
    # Clear any stale result file so an early-exit run cannot reuse a previous
    # PASS verdict. test_result_init inside run.sh also removes it once
    # RESULT_ID and RES_FILE are resolved, but removing it here ensures the
    # publisher sees no file when run.sh exits before that point.
    - rm -f Video_V4L2_config1.res || true
    # --testname overrides the result identity so run.sh writes
    # Video_V4L2_config1.res and the verdict string inside it.
    # Existing jobs that do not pass --testname still get Video_V4L2_Runner.res.
    # --missing-media-skip: missing clips → SKIP instead of FAIL on images that
    # never pre-staged these opt-in clips, without weakening genuine codec FAILures.
    - VIDEO_POLICY_SCOPE="${VIDEO_POLICY_SCOPE}" VIDEO_VERIFY="${VIDEO_VERIFY}" VIDEO_MIN_PSNR="${VIDEO_MIN_PSNR}" ./run.sh --app "${APP_PATH}" --config "${CONFIG_PATH}" --platform "${PLATFORM}" --stack "${VIDEO_STACK}" --loglevel "${LOGLEVEL}" --retry-on-fail "${RETRY_ON_FAIL}" --post-test-sleep "${POST_TEST_SLEEP}" --testname "Video_V4L2_config1" --missing-media-skip || true
    # --expected-testcase-id enforces that the .res contains the correct testcase
    # identity; send-to-lava.sh exits non-zero if the file is absent or mismatched.
    - $REPO_PATH/Runner/utils/send-to-lava.sh Video_V4L2_config1.res --expected-testcase-id Video_V4L2_config1
