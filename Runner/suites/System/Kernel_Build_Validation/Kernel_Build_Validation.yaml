metadata:
  name: Kernel_Build_Validation
  format: Lava-Test Test Definition 1.0
  description: Validate the running kernel release against the deployment contract.
  os:
    - linux
  scope:
    - functional
params:
  EXPECTED_RELEASE: null
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/System/Kernel_Build_Validation
    - ./run.sh ${EXPECTED_RELEASE:+--expected-release "${EXPECTED_RELEASE}"} || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh Kernel_Build_Validation.res
