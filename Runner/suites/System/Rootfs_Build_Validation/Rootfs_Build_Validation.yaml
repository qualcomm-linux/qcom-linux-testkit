metadata:
  name: Rootfs_Build_Validation
  format: Lava-Test Test Definition 1.0
  description: Validate the rootfs BUILD_ID against the deployment contract.
  os:
    - linux
  scope:
    - functional
params:
  EXPECTED_BUILD_ID: null
  RELEASE_FILE: null
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/System/Rootfs_Build_Validation
    - ./run.sh ${EXPECTED_BUILD_ID:+--expected-build-id "${EXPECTED_BUILD_ID}"} ${RELEASE_FILE:+--release-file "${RELEASE_FILE}"} || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh Rootfs_Build_Validation.res
