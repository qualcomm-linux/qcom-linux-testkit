metadata:
  name: SystemReady_ACS_Result_Validation
  format: Lava-Test Test Definition 1.0
  description: Validate and import the compliance verdicts of an existing Arm SystemReady ACS report.
  os:
    - linux
  scope:
    - functional
params:
  RESULTS: null
  REQUIRED_SUITES: null
  SUMMARY_SHA256: null
run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/System/SystemReady_ACS_Result_Validation
    - ./run.sh ${RESULTS:+--results "${RESULTS}"} ${REQUIRED_SUITES:+--required-suites "${REQUIRED_SUITES}"} ${SUMMARY_SHA256:+--summary-sha256 "${SUMMARY_SHA256}"} || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh SystemReady_ACS_Result_Validation.res
